<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Zihuanana · Jiaan Zhao">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1f4"/>
    </linearGradient>
    <linearGradient id="mline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0969da"/>
      <stop offset="0.5" stop-color="#8250df"/>
      <stop offset="1" stop-color="#1a7f37"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="298" rx="16" fill="url(#bg)" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- 角标：站牌式线路徽标 -->
  <g>
    <rect x="40" y="36" width="48" height="48" rx="12" fill="none" stroke="#d0d7de" stroke-width="2"/>
    <text x="64" y="70" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="700" fill="#0969da">Z</text>
  </g>
  <g>
    <rect x="1112" y="36" width="48" height="48" rx="12" fill="none" stroke="#d0d7de" stroke-width="2"/>
    <text x="1136" y="70" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="600" fill="#57606a">北</text>
  </g>

  <text x="600" y="84" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" letter-spacing="7" fill="#57606a">JIAAN ZHAO · 学生开发者</text>
  <text x="600" y="168" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="62" font-weight="600" letter-spacing="20" fill="#1f2328">ZIHUANANA</text>

  <!-- 地铁线路：五站对应五个项目 -->
  <line x1="150" y1="232" x2="1050" y2="232" stroke="url(#mline)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="300" cy="232" r="8" fill="#C23A30" stroke="#ffffff" stroke-width="3"/>
  <circle cx="450" cy="232" r="8" fill="#006098" stroke="#ffffff" stroke-width="3"/>
  <circle cx="600" cy="232" r="8" fill="#008E9C" stroke="#ffffff" stroke-width="3"/>
  <circle cx="750" cy="232" r="8" fill="#A6217F" stroke="#ffffff" stroke-width="3"/>
  <circle cx="900" cy="232" r="8" fill="#E77212" stroke="#ffffff" stroke-width="3"/>

  <text x="600" y="272" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" letter-spacing="4" fill="#57606a">一站通 · 小海GPT · 客流周报 · 客流演变 · 站牌生成</text>
